# behavior ---------------------------------------------------------------

set-option -g default-command "reattach-to-user-namespace -l zsh"

# Set prefix key to [ctrl] + [a]
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# set -g default-terminal 'screen-256color'
set-option -g default-terminal "${TERM}"
set-option -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set-option -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Select pane with mouse
# set -g mouse-select-pane on
set -g mouse on

# Vim suggests focus events
set-option -g focus-events on

# Set the esc/alt disambiguation timeout to 25ms.
set-option -sg escape-time 10

# Start numbering windows at 1
# left window == left key
set-option -g base-index 1
set-option -g pane-base-index 1

# Maintain consecutive number order
set-option -g renumber-windows on

# 'bell' in any of the attached session
set-option -g bell-action any

set-option -g visual-bell off

set -g history-limit 10000


# visual -----------------------------------------------------------------

set -g pane-active-border fg="#111111"
set-option -g clock-mode-style 24

# Title windows
set-option -g set-titles on
set-option -g set-titles-string '[#S:#I] #W'


# vim-like ---------------------------------------------------------------

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi Escape send -X cancel

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# statusbar --------------------------------------------------------------

set -g display-time 2000

source ~/.tmux.local.conf

# Text of the current window tab: the parent directory cut to 5 characters, a slash, the basename.
%hidden CURRENT_DIR='#{=|5|…;s|^.*(/([^/]+)[^/]*/)([^/]+)$|\2|:pane_current_path}/#{b:pane_current_path}'

# Window tabs: the number with a rounded left edge, then the title with a rounded right edge.
# Light colours are Catppuccin Latte.
set-hook -g client-light-theme {
  set -g status-style "bg=#e6e9ef,fg=#4c4f69"
  set -g message-style "fg=#179299,bg=#9ca0b0,fill=#9ca0b0"
  set -g message-command-style "fg=#179299,bg=#9ca0b0,fill=#9ca0b0"
  set -g menu-selected-style "fg=#4c4f69,bold,bg=#9ca0b0"
  set -g popup-style "bg=#eff1f5,fg=#4c4f69"
  set -g popup-border-style "fg=#bcc0cc"
  set -g mode-style "bg=#ccd0da,bold"
  set -g clock-mode-colour "#1e66f5"
  set -g pane-border-style "fg=#9ca0b0"
  set -g pane-active-border-style "#{?pane_in_mode,fg=#7287fd,#{?pane_synchronized,fg=#8839ef,fg=#7287fd}}"
  set -g window-status-activity-style "bg=#7287fd,fg=#dce0e8"
  set -g window-status-bell-style "bg=#df8e1d,fg=#dce0e8"
  set -g window-status-format "#[fg=#dce0e8,bg=#7c7f93]#[fg=#e6e9ef,reverse]\ue0b6#[none]#I #[fg=#4c4f69,bg=#ccd0da] #T#[fg=#e6e9ef,reverse]\ue0b4#[none]"
  set -g window-status-current-format "#[fg=#dce0e8,bg=#8839ef]#[fg=#e6e9ef,reverse]\ue0b6#[none]#I #[fg=#4c4f69,bg=#bcc0cc]$CURRENT_DIR#[fg=#e6e9ef,reverse]\ue0b4#[none]"
}

# Dark colours are Catppuccin Frappe.
set-hook -g client-dark-theme {
  set -g status-style "bg=#292c3c,fg=#c6d0f5"
  set -g message-style "fg=#81c8be,bg=#737994,fill=#737994"
  set -g message-command-style "fg=#81c8be,bg=#737994,fill=#737994"
  set -g menu-selected-style "fg=#c6d0f5,bold,bg=#737994"
  set -g popup-style "bg=#303446,fg=#c6d0f5"
  set -g popup-border-style "fg=#51576d"
  set -g mode-style "bg=#414559,bold"
  set -g clock-mode-colour "#8caaee"
  set -g pane-border-style "fg=#737994"
  set -g pane-active-border-style "#{?pane_in_mode,fg=#babbf1,#{?pane_synchronized,fg=#ca9ee6,fg=#babbf1}}"
  set -g window-status-activity-style "bg=#babbf1,fg=#232634"
  set -g window-status-bell-style "bg=#e5c890,fg=#232634"
  set -g window-status-format "#[fg=#232634,bg=#949cbb]#[fg=#292c3c,reverse]\ue0b6#[none]#I #[fg=#c6d0f5,bg=#414559] #T#[fg=#292c3c,reverse]\ue0b4#[none]"
  set -g window-status-current-format "#[fg=#232634,bg=#ca9ee6]#[fg=#292c3c,reverse]\ue0b6#[none]#I #[fg=#c6d0f5,bg=#51576d]$CURRENT_DIR#[fg=#292c3c,reverse]\ue0b4#[none]"
}

# A new server has no client to report a theme, so follow the macOS appearance.
if-shell '[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = Dark ]' {
  set-hook -gR client-dark-theme
} {
  set-hook -gR client-light-theme
}
